name: Commit Change Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base commit or ref
        required: false
        type: string
      head:
        description: Optional head commit or ref
        required: false
        type: string
      target_path:
        description: Optional repository subdirectory or file path to analyze
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[excel]"

      - name: Resolve analysis arguments
        id: args
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ inputs.base }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ inputs.head || 'HEAD' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "target_path=${{ inputs.target_path }}" >> "$GITHUB_OUTPUT"

      - name: Run analyzer
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TEMPERATURE: ${{ secrets.AI_TEMPERATURE }}
          AI_TIMEOUT_SECONDS: ${{ secrets.AI_TIMEOUT_SECONDS }}
        shell: bash
        run: |
          set -euo pipefail
          cmd=(python analyze_commits.py --mode api --output-dir output)
          if [[ -n "${{ steps.args.outputs.base }}" ]]; then
            cmd+=(--base "${{ steps.args.outputs.base }}")
          fi
          if [[ -n "${{ steps.args.outputs.head }}" ]]; then
            cmd+=(--head "${{ steps.args.outputs.head }}")
          fi
          if [[ -n "${{ steps.args.outputs.target_path }}" ]]; then
            cmd+=(--path "${{ steps.args.outputs.target_path }}")
          fi
          printf 'Running command:'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          "${cmd[@]}"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commit-change-analysis
          path: output/

      - name: Comment AI analysis on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'output/ai-analysis.md';
            const fallbackPath = 'output/analysis-report.md';
            const marker = '<!-- commit-change-analysis -->';
            const bodyContent = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : fs.readFileSync(fallbackPath, 'utf8');
            const body = `${marker}\n## Commit Change Analysis\n\n${bodyContent}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

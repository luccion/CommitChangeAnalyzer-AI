[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-change-analyzer"
version = "0.1.0"
description = "Analyze commit changes with a focus on Excel and CSV data files."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
commit-change-analyzer = "commit_change_analyzer.cli:main"

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
